<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Weekly Hub</title>
<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f0f1f4;
  --text: #1a1d23;
  --text-2: #6b7280;
  --border: #e2e4e9;
  --accent: #2563eb;
  --accent-text: #ffffff;
  --red: #dc2626;   --red-bg: #fee2e2;
  --yellow: #d97706; --yellow-bg: #fef3c7;
  --green: #16a34a; --green-bg: #dcfce7;
  --blue: #2563eb;  --blue-bg: #dbeafe;
  --purple: #7c3aed; --purple-bg: #ede9fe;
  --orange: #ea580c; --orange-bg: #ffedd5;
  --amber: #b45309; --amber-bg: #fef3c7;
  --gray: #6b7280;  --gray-bg: #e5e7eb;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111318;
    --surface: #1c1f26;
    --surface-2: #262a33;
    --text: #e8eaf0;
    --text-2: #9aa1ad;
    --border: #32363f;
    --accent: #3b82f6;
    --red: #f87171; --red-bg: #3f1d1d;
    --yellow: #fbbf24; --yellow-bg: #3d2f10;
    --green: #4ade80; --green-bg: #14331e;
    --blue: #60a5fa; --blue-bg: #1a2942;
    --purple: #a78bfa; --purple-bg: #2a2142;
    --orange: #fb923c; --orange-bg: #3d2410;
    --amber: #fbbf24; --amber-bg: #3d2f10;
    --gray: #9aa1ad; --gray-bg: #2e323b;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.45;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }

/* ---------- Header ---------- */
#hdr {
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; gap: 16px; flex: none; z-index: 30;
}
.hdr-left { display: flex; align-items: center; gap: 18px; min-width: 320px; }
#hdr h1 { font-size: 1.15rem; white-space: nowrap; }
#tabs { display: flex; background: var(--surface-2); border-radius: 9px; padding: 3px; }
#tabs button {
  border: none; background: none; color: var(--text-2); font-weight: 600;
  padding: 5px 14px; border-radius: 7px; font-size: .85rem;
}
#tabs button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.hdr-center { display: flex; align-items: center; gap: 10px; }
#wkLabel { text-align: center; min-width: 230px; }
#wkLabel .t { font-weight: 700; font-size: 1.05rem; }
#wkLabel .s { font-size: .72rem; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; }
.iconbtn {
  background: none; border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem;
}
.iconbtn:hover { background: var(--surface-2); }
.iconbtn:disabled { opacity: .3; cursor: default; }
.hdr-right { display: flex; align-items: center; gap: 10px; min-width: 320px; justify-content: flex-end; }
#saveStatus { font-size: .8rem; color: var(--text-2); }
.btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 7px 14px; border-radius: 9px; font-weight: 600; font-size: .87rem;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--red); border-color: var(--red); background: none; }
.btn.sm { padding: 4px 10px; font-size: .8rem; }

/* ---------- Banner ---------- */
#banner {
  background: var(--blue-bg); color: var(--text); padding: 9px 20px; flex: none;
  display: flex; align-items: center; justify-content: center; gap: 14px; font-size: .9rem;
  border-bottom: 1px solid var(--border);
}
#banner b { color: var(--blue); }

/* ---------- Dashboard columns ---------- */
#view-dash { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 16px 20px; overflow: hidden; }
.col {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; min-width: 0;
}
.col-head { padding: 13px 16px 10px; border-bottom: 2px solid var(--colc); flex: none; display: flex; align-items: center; justify-content: space-between; }
.col-head h2 { font-size: .82rem; text-transform: uppercase; letter-spacing: .09em; color: var(--colc); }
.col-pri { --colc: var(--blue); }
.col-com { --colc: var(--green); }
.col-mis { --colc: var(--amber); }
.col-body { flex: 1; overflow-y: auto; padding: 12px 16px 20px; }
.col-foot { flex: none; border-top: 1px solid var(--border); padding: 9px 16px; font-size: .87rem; font-weight: 600; }
#view-dash.readonly .col-pri .col-body, #view-dash.readonly #slateWrap { opacity: .65; }
.ro-note { font-size: .72rem; color: var(--text-2); font-weight: 500; text-transform: none; letter-spacing: 0; }

/* sections inside columns */
.sec { margin-bottom: 18px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.sec-h h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--text-2); }
.sec-h .cnt { font-size: .72rem; color: var(--text-2); background: var(--surface-2); border-radius: 99px; padding: 1px 8px; }
.linklike { background: none; border: none; color: var(--accent); font-size: .8rem; font-weight: 600; padding: 2px 4px; }
.linklike:hover { text-decoration: underline; }
.empty { color: var(--text-2); font-size: .83rem; font-style: italic; padding: 4px 2px; }

/* ---------- Rows ---------- */
.row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 6px; border-radius: 8px; position: relative; }
.row:hover { background: var(--surface-2); }
.row .grow { flex: 1; min-width: 0; }
.row .rowdel, .row .rowedit { visibility: hidden; background: none; border: none; color: var(--text-2); font-size: .85rem; padding: 0 3px; }
.row:hover .rowdel, .row:hover .rowedit { visibility: visible; }
.row .rowdel:hover { color: var(--red); }
.row .rowedit:hover { color: var(--accent); }
.chk { appearance: none; width: 17px; height: 17px; border: 1.5px solid var(--text-2); border-radius: 5px; flex: none; margin-top: 2px; cursor: pointer; position: relative; background: var(--surface); padding: 0; }
.chk:checked { background: var(--colc, var(--accent)); border-color: var(--colc, var(--accent)); }
.chk:checked::after { content: "✓"; color: #fff; font-size: 12px; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.chk:disabled { opacity: .45; cursor: default; }
.done .txt { text-decoration: line-through; color: var(--text-2); }
.pill { display: inline-block; font-size: .68rem; font-weight: 700; border-radius: 5px; padding: 1px 6px; vertical-align: 1px; }
.tag { display: inline-block; font-size: .68rem; font-weight: 600; border-radius: 99px; padding: 1px 7px; background: var(--surface-2); color: var(--text-2); }
.greyed { opacity: .5; }
.wk-divider { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--text-2); margin: 12px 0 4px; border-top: 1px dashed var(--border); padding-top: 8px; }

/* ---------- Priorities ---------- */
/* top-level categories (Life, Work) */
.cat-top { margin-bottom: 16px; }
.cat-top-h {
  display: flex; align-items: center; gap: 8px; margin-bottom: 6px; cursor: pointer;
  padding: 4px 2px; border-radius: 6px; user-select: none;
}
.cat-top-h:hover { background: var(--surface-2); }
.cat-top-h h3 { font-size: .82rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text); font-weight: 700; }
.cat-top-h .line { flex: 1; height: 1px; background: var(--border); }
.cat-top-h .collapse-icon { font-size: .75rem; color: var(--text-2); transition: transform .15s; }
.cat-top-h.collapsed .collapse-icon { transform: rotate(-90deg); }
.cat-top-body { }
.cat-top-body.hidden { display: none; }

/* subcategories */
.cat-sub { margin-bottom: 10px; margin-left: 6px; }
.cat-sub-h {
  display: flex; align-items: center; gap: 6px; margin-bottom: 4px; cursor: pointer;
  padding: 2px 2px; border-radius: 5px; user-select: none;
}
.cat-sub-h:hover { background: var(--surface-2); }
.cat-sub-h h4 { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--text-2); font-weight: 600; }
.cat-sub-h .line { flex: 1; height: 1px; background: var(--border); }
.cat-sub-h .collapse-icon { font-size: .7rem; color: var(--text-2); transition: transform .15s; }
.cat-sub-h.collapsed .collapse-icon { transform: rotate(-90deg); }
.cat-sub-body.hidden { display: none; }

.addform { display: none; flex-direction: column; gap: 6px; padding: 8px; background: var(--surface-2); border-radius: 8px; margin-top: 4px; }
.addform.open { display: flex; }
.addform .frow { display: flex; gap: 6px; align-items: center; }
.addform input[type=text] { flex: 1; }
.addform label { font-size: .8rem; color: var(--text-2); display: flex; align-items: center; gap: 4px; }

/* task status badge */
.task-status { font-size: .68rem; font-weight: 600; border-radius: 5px; padding: 1px 6px; display: inline-block; vertical-align: 1px; }
.ts-not-started { color: var(--gray); background: var(--gray-bg); }
.ts-in-progress  { color: var(--blue); background: var(--blue-bg); }
.ts-on-hold      { color: var(--yellow); background: var(--yellow-bg); }
.ts-push-next    { color: var(--orange); background: var(--orange-bg); }

/* loe badge */
.loe { font-size: .65rem; font-weight: 700; border-radius: 5px; padding: 1px 5px; display: inline-block; vertical-align: 1px; opacity: .85; }
.loe-H { color: var(--red); background: var(--red-bg); }
.loe-M { color: var(--yellow); background: var(--yellow-bg); }
.loe-L { color: var(--gray); background: var(--gray-bg); }

/* task row priority shading */
.task-row-H { background: color-mix(in srgb, var(--red-bg) 30%, transparent); border-left: 2px solid var(--red); }
.task-row-H:hover { background: color-mix(in srgb, var(--red-bg) 50%, transparent) !important; }
.task-row-M { background: color-mix(in srgb, var(--yellow-bg) 25%, transparent); border-left: 2px solid var(--yellow); }
.task-row-M:hover { background: color-mix(in srgb, var(--yellow-bg) 45%, transparent) !important; }
.task-row-L { border-left: 2px solid var(--border); }

/* Top Tasks pinned section */
.top-tasks-section { background: color-mix(in srgb, var(--blue-bg) 18%, var(--bg)); border: 1px solid color-mix(in srgb, var(--blue) 30%, var(--border)); border-radius: 8px; padding: 6px 8px 4px; margin-bottom: 10px; }
.top-tasks-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--blue); opacity: .85; }
.top-tasks-header .ttcount { font-size: .68rem; background: var(--blue-bg); color: var(--blue); border-radius: 10px; padding: 1px 6px; font-weight: 600; }
.pin-badge { font-size: .62rem; font-weight: 700; background: var(--blue-bg); color: var(--blue); border-radius: 4px; padding: 1px 5px; vertical-align: 1px; margin-right: 2px; cursor: default; }
.row .pin-btn { font-size: .75rem; background: none; border: none; cursor: pointer; opacity: .35; padding: 2px 4px; color: var(--text-1); line-height: 1; border-radius: 4px; }
.row .pin-btn:hover, .row .pin-btn.pinned { opacity: 1; color: var(--blue); }

/* thank you section */
.ty-row { border-left: 2px solid var(--blue); padding-left: 6px; }
.ty-title { font-weight: 600; }
.ty-notes { font-size: .8rem; color: var(--text-2); margin-top: 2px; white-space: pre-wrap; }

/* ---------- Community ---------- */
.c-name { font-weight: 600; cursor: pointer; }
.c-name:hover { color: var(--accent); }
.c-sub { font-size: .76rem; color: var(--text-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 7px; }

/* Day-of-week slate headers */
.day-group { margin-bottom: 10px; }
.day-label {
  font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-2);
  font-weight: 700; padding: 4px 6px; background: var(--surface-2); border-radius: 5px;
  margin-bottom: 4px; display: flex; align-items: center; gap: 6px;
}
.day-label.today { color: var(--green); }
.day-label.past { opacity: .55; }
.day-label.no-entry { opacity: .45; font-style: italic; }

/* Occasion badge on slate row */
.occasion-badge {
  display: inline-block; font-size: .68rem; font-weight: 600; border-radius: 5px;
  padding: 1px 6px; background: color-mix(in srgb, var(--green-bg) 60%, transparent);
  color: var(--green); vertical-align: 1px; margin-left: 4px;
}

/* Reached Out section */
.reached-out-row { border-left: 2px solid var(--purple); padding-left: 6px; }

/* Follow up section */
.followup-row { border-left: 2px solid var(--orange); padding-left: 6px; }
.followup-action { font-size: .68rem; font-weight: 700; color: var(--orange); display: inline-block; border-radius: 5px; padding: 1px 6px; background: color-mix(in srgb, var(--orange-bg) 60%, transparent); vertical-align: 1px; margin-left: 4px; }
.followup-flag { font-size: .68rem; color: var(--orange); font-weight: 700; }

/* Action needed filter bar */
.filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
.filter-bar input, .filter-bar select { font-size: .78rem; padding: 4px 8px; height: 28px; }
.filter-bar input { width: 110px; }

/* ---------- Mission ---------- */
.mis-add { display: flex; gap: 6px; margin-bottom: 8px; }
.mis-add input { flex: 1; font-size: .85rem; padding: 6px 9px; }
.mis-add input.ref { flex: 0 0 84px; }
.mis-date { font-size: .72rem; color: var(--text-2); white-space: nowrap; margin-top: 3px; }
.verse-ref { font-size: .8rem; color: var(--amber); font-weight: 700; display: block; margin-bottom: 1px; }
.verse-meaning { font-size: .76rem; color: var(--text-2); margin-top: 3px; font-style: normal; }
.ghm-title { font-weight: 600; display: block; }
.ghm-notes { font-size: .82rem; color: var(--text-2); margin-top: 2px; white-space: pre-wrap; }

/* note follow-up highlight */
.note-followup { background: color-mix(in srgb, var(--amber-bg) 50%, transparent) !important; border-left: 2px solid var(--amber); padding-left: 6px; }
.note-fu-icon { font-size: .75rem; color: var(--amber); margin-left: 4px; }

/* ---------- Contacts view ---------- */
#view-contacts { flex: 1; overflow-y: auto; padding: 16px 20px; display: none; }
#cToolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; max-width: 1100px; margin-left: auto; margin-right: auto; }
#cSearch { flex: 1; min-width: 220px; }
#cList { max-width: 1100px; margin: 0 auto; }
.chips { display: flex; gap: 6px; }
.chip { border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: 99px; padding: 4px 12px; font-size: .8rem; font-weight: 600; }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.grp-h { display: flex; align-items: center; gap: 8px; margin: 18px 0 6px; font-size: .85rem; font-weight: 700; }
.grp-h .cnt { font-size: .72rem; color: var(--text-2); font-weight: 600; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; cursor: pointer;
}
.card:hover { border-color: var(--accent); }
.card .nm { font-weight: 600; }
.card .meta { font-size: .78rem; color: var(--text-2); }
.card .right { margin-left: auto; text-align: right; flex: none; }
.ro-section { border: 1px dashed var(--orange); border-radius: var(--radius); padding: 10px 12px; margin-top: 22px; background: color-mix(in srgb, var(--orange-bg) 35%, transparent); }

/* ---------- Modals ---------- */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50;
  display: flex; align-items: flex-start; justify-content: center; padding: 7vh 16px;
}
.dialog {
  background: var(--surface); border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.3);
  width: 100%; max-width: 520px; max-height: 84vh; overflow-y: auto; padding: 20px;
}
.dialog h2 { font-size: 1.05rem; margin-bottom: 14px; }
.dialog .frow { display: flex; gap: 10px; margin-bottom: 10px; }
.dialog .frow > * { flex: 1; }
.dialog label.fl { display: block; font-size: .76rem; font-weight: 600; color: var(--text-2); margin-bottom: 3px; }
.dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.dialog textarea { width: 100%; min-height: 100px; resize: vertical; }
.detail-row { display: flex; gap: 10px; padding: 4px 0; font-size: .88rem; }
.detail-row .lbl { flex: 0 0 110px; color: var(--text-2); }
.hist { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; }
.hist-item { margin-bottom: 10px; font-size: .86rem; }
.hist-item .d { font-size: .74rem; color: var(--text-2); font-weight: 600; }
.hist-item .note { white-space: pre-wrap; }

/* ---------- Setup ---------- */
#setupPrompt { flex: 1; display: none; align-items: center; justify-content: center; padding: 30px; }
#setupPrompt .inner { max-width: 520px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px; }
#setupPrompt h2 { margin-bottom: 10px; }
#setupPrompt p { color: var(--text-2); margin-bottom: 14px; font-size: .9rem; }

/* ---------- Toast ---------- */
#toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 9px 18px; border-radius: 99px;
  font-size: .85rem; font-weight: 600; display: none; z-index: 99;
}
</style>
</head>
<body>

<header id="hdr">
  <div class="hdr-left">
    <h1>Weekly Hub</h1>
    <nav id="tabs">
      <button id="tabDash" class="active">Dashboard</button>
      <button id="tabContacts">All Contacts</button>
    </nav>
  </div>
  <div class="hdr-center">
    <button id="wkPrev" class="iconbtn" title="Previous week">←</button>
    <div id="wkLabel"><div class="t">—</div><div class="s"></div></div>
    <button id="wkNext" class="iconbtn" title="Next week">→</button>
  </div>
  <div class="hdr-right">
    <span id="saveStatus"></span>
    <button id="btnSetActive" class="btn primary" style="display:none">Set as Active Week</button>
    <button id="btnNewWeek" class="btn primary" style="display:none">Start New Week</button>
    <button id="btnSettings" class="iconbtn" title="Settings">⚙</button>
  </div>
</header>

<div id="banner" style="display:none">
  <span>A new week is available — <b id="bannerWk"></b></span>
  <button id="bannerStart" class="btn primary sm">Start New Week</button>
  <button id="bannerDismiss" class="btn sm">Later</button>
</div>

<main id="view-dash">
  <section class="col col-pri">
    <div class="col-head"><h2>Priorities</h2><span class="ro-note" id="priRo"></span></div>
    <div class="col-body" id="priBody"></div>
    <div class="col-foot" id="priFoot"></div>
  </section>
  <section class="col col-com">
    <div class="col-head"><h2>Community</h2></div>
    <div class="col-body" id="comBody"></div>
    <div class="col-foot"><a id="openContacts">All Contacts →</a></div>
  </section>
  <section class="col col-mis">
    <div class="col-head"><h2>Mission</h2><span class="ro-note" id="misRo"></span></div>
    <div class="col-body" id="misBody"></div>
  </section>
</main>

<main id="view-contacts">
  <div id="cToolbar">
    <input id="cSearch" type="search" placeholder="Search contacts…">
    <div class="chips" id="cChips"></div>
    <select id="cSort">
      <option value="overdue">Overdue first</option>
      <option value="alpha">Name A–Z</option>
      <option value="priority">Priority</option>
      <option value="last">Last contacted</option>
    </select>
    <button class="btn primary" id="btnAddContact">+ Add Contact</button>
  </div>
  <div id="cList"></div>
</main>

<div id="setupPrompt">
  <div class="inner">
    <h2>Connect GitHub</h2>
    <p>This hub stores its data in a GitHub repository (<code>data.json</code> for contacts, <code>dashboard.json</code> for the weekly sheet). Enter your Personal Access Token and repo details to begin.</p>
    <button class="btn primary" id="btnSetup">Open Settings</button>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";

/* ================= State ================= */
let contacts = [], contactsSha = null;
let dash = null, dashSha = null;
let viewedWeek = null;
let currentTab = "dash";
let cFilter = { q: "", type: "All", sort: "overdue" };
let comFilter = { loc: "", tag: "" };
// collapsed state for priority top-level cats and subcats (persisted in sessionStorage)
let priCollapsed = {};

const MAINTAIN_TYPES = ["Friend", "Mentor", "Mentee", "Other"];
const PRIO_ORDER = { High: 0, Medium: 1, Low: 2 };
const PRIO_COLORS = { High: ["var(--red)","var(--red-bg)"], Medium: ["var(--yellow)","var(--yellow-bg)"], Low: ["var(--gray)","var(--gray-bg)"] };
const TYPE_COLORS = { Friend: ["var(--blue)","var(--blue-bg)"], Mentor: ["var(--purple)","var(--purple-bg)"], Mentee: ["var(--green)","var(--green-bg)"], "Reach Out": ["var(--orange)","var(--orange-bg)"], Other: ["var(--gray)","var(--gray-bg)"] };

/* ================= Generic helpers ================= */
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }
function uuid() { return crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
function $(id) { return document.getElementById(id); }

/* ---------- Dates ---------- */
function parseDate(s) { if (!s) return new Date(); const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function todayDate() { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function fmtISO(d) { return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function todayStr() { return fmtISO(todayDate()); }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function addDaysISO(iso, n) { const d = parseDate(iso); d.setDate(d.getDate() + n); return fmtISO(d); }
function fmtShort(s) { return parseDate(s).toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
function fmtLong(s) { return parseDate(s).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }); }
function fmtTime(iso) { const d = new Date(iso); return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function curMonday() { return fmtISO(mondayOf(new Date())); }
// Return 0=Mon … 6=Sun index for ISO date string
function dowIndex(iso) { const d = parseDate(iso); return (d.getDay() + 6) % 7; }
function dayLabel(iso) {
  const idx = dowIndex(iso);
  const today = todayStr();
  const label = DAYS_OF_WEEK[idx] + " · " + fmtShort(iso);
  return label;
}

/* ---------- Contact computed logic ---------- */
function isReachOut(c) { return c.type === "Reach Out"; }
function nextDate(c) { const d = parseDate(c.lastContactedDate); d.setDate(d.getDate() + (c.cadenceDays || 30)); return d; }
function daysUntilNext(c) { if (isReachOut(c) || !c.lastContactedDate) return 9999; return daysBetween(todayDate(), nextDate(c)); }
function daysSinceLast(c) { return c.lastContactedDate ? daysBetween(parseDate(c.lastContactedDate), todayDate()) : null; }
function autoStatus(c) {
  if (isReachOut(c)) return c.manualStatus || "Reach Out";
  if (c.manualStatus) return c.manualStatus;
  const du = daysUntilNext(c);
  if (du === 9999) return "On Track";
  if (du < 0) return "Overdue";
  if (du <= 7) return "Due Soon";
  return "On Track";
}
const STATUS_COLORS = {
  "Overdue": ["var(--red)","var(--red-bg)"], "Due Soon": ["var(--yellow)","var(--yellow-bg)"],
  "On Track": ["var(--green)","var(--green-bg)"], "Scheduled": ["var(--blue)","var(--blue-bg)"],
  "Reached Out": ["var(--purple)","var(--purple-bg)"], "On Hold": ["var(--gray)","var(--gray-bg)"],
  "Reach Out": ["var(--orange)","var(--orange-bg)"],
  "Awaiting Next Meeting": ["var(--orange)","var(--orange-bg)"], "Follow Up": ["var(--orange)","var(--orange-bg)"]
};

/* ---------- Base64 (unicode-safe) ---------- */
function b64encode(str) {
  const bytes = new TextEncoder().encode(str); let bin = "";
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(bin);
}
function b64decode(b64) {
  const bin = atob(b64.replace(/\n/g, "")); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ================= GitHub storage ================= */
function getCfg() {
  return {
    pat: localStorage.getItem("gh_pat") || "",
    user: localStorage.getItem("gh_user") || "",
    repo: localStorage.getItem("gh_repo") || "",
    branch: localStorage.getItem("gh_branch") || "main"
  };
}
function cfgOk(c) { return c.pat && c.user && c.repo; }
function ghUrl(cfg, path) { return "https://api.github.com/repos/" + cfg.user + "/" + cfg.repo + "/contents/" + path; }

async function ghGet(path) {
  const cfg = getCfg();
  const res = await fetch(ghUrl(cfg, path) + "?ref=" + encodeURIComponent(cfg.branch), {
    headers: { Authorization: "token " + cfg.pat, Accept: "application/vnd.github+json" }, cache: "no-store"
  });
  if (res.status === 404) return null;
  if (!res.ok) { const e = new Error("read " + path); e.status = res.status; throw e; }
  const j = await res.json();
  return { data: JSON.parse(b64decode(j.content)), sha: j.sha };
}
async function ghPut(path, obj, msg) {
  const cfg = getCfg();
  const latest = await ghGet(path);
  const body = { message: msg, content: b64encode(JSON.stringify(obj, null, 2)), branch: cfg.branch };
  if (latest) body.sha = latest.sha;
  const res = await fetch(ghUrl(cfg, path), {
    method: "PUT",
    headers: { Authorization: "token " + cfg.pat, Accept: "application/vnd.github+json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) { const e = new Error("write " + path); e.status = res.status; throw e; }
  return (await res.json()).content.sha;
}

/* ================= Week engine ================= */
function emptyWeekCommunity() { return { currentSlate: {}, introReachedOut: {}, followUps: [] }; }
function defaultDash() {
  const wk = curMonday();
  return {
    activeWeek: wk,
    categories: { Life: [], Work: [] },
    recurringTasks: [],
    thankyous: [],
    priorities: [],   // global running list
    mission: { ghms: [], memoryVerses: [], notes: [] }, // global running list
    weeks: { [wk]: emptyWeekCommunity() },
    snapshots: {}     // keyed by week ISO: { priorities, mission } frozen at advance time
  };
}
function weekKeys() { return Object.keys(dash.weeks).sort(); }
function isActiveWeek() { return viewedWeek === dash.activeWeek; }
function isPastWeek() { return viewedWeek < dash.activeWeek; }
function isFutureWeek() { return viewedWeek > dash.activeWeek; }
function fmtWeek(wk) { return "Week of " + parseDate(wk).toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" }); }

/* Ensure a week shell exists; create if navigating forward */
function ensureWeek(wk) {
  if (!dash.weeks[wk]) dash.weeks[wk] = emptyWeekCommunity();
}

/* Set a new active week (manual). Takes a snapshot of current priorities+mission. */
function setActiveWeek(wk) {
  if (wk === dash.activeWeek) return;
  const outgoing = dash.activeWeek;

  // Snapshot the outgoing active week
  dash.snapshots[outgoing] = {
    priorities: JSON.parse(JSON.stringify(dash.priorities)),
    mission: JSON.parse(JSON.stringify(dash.mission))
  };

  // If the incoming week already has a snapshot (e.g. we're going back to a past week),
  // promote those priorities into the global list so they're visible and editable.
  // Then remove that snapshot since it's now the active week, not a frozen past.
  if (dash.snapshots[wk]) {
    const snap = dash.snapshots[wk];
    // Merge: keep any tasks already in global list (by id), add snapshot tasks
    const existingIds = new Set(dash.priorities.map(t => t.id));
    (snap.priorities || []).forEach(t => { if (!existingIds.has(t.id)) dash.priorities.push(t); });
    // Merge mission too
    const ghmIds = new Set(dash.mission.ghms.map(e => e.id));
    const verseIds = new Set(dash.mission.memoryVerses.map(e => e.id));
    const noteIds = new Set(dash.mission.notes.map(e => e.id));
    (snap.mission?.ghms || []).forEach(e => { if (!ghmIds.has(e.id)) dash.mission.ghms.push(e); });
    (snap.mission?.memoryVerses || []).forEach(e => { if (!verseIds.has(e.id)) dash.mission.memoryVerses.push(e); });
    (snap.mission?.notes || []).forEach(e => { if (!noteIds.has(e.id)) dash.mission.notes.push(e); });
    delete dash.snapshots[wk];
  }

  dash.activeWeek = wk;
  ensureWeek(wk);
  syncSlate(wk);
  saveDash();
  viewedWeek = wk;
  render();
  toast("Active week set to " + fmtWeek(wk));
}

/* Return the priorities/mission to display for viewedWeek:
   - active or future → live global lists
   - past → snapshot (frozen) */
function viewedPriorities() {
  if (!isPastWeek()) return dash.priorities;
  const snap = dash.snapshots[viewedWeek];
  return snap ? snap.priorities : [];
}
function viewedMission() {
  if (!isPastWeek()) return dash.mission;
  const snap = dash.snapshots[viewedWeek];
  return snap ? snap.mission : { ghms: [], memoryVerses: [], notes: [] };
}

/* Slate sync for a given week */
function syncSlate(wk) {
  wk = wk || dash.activeWeek;
  if (!wk) return false;
  ensureWeek(wk);
  const w = dash.weeks[wk];
  const end = addDaysISO(wk, 6);
  let changed = false;
  contacts.forEach(c => {
    if (c.scheduledDate && c.scheduledDate >= wk && c.scheduledDate <= end && !w.currentSlate[c.id]) {
      w.currentSlate[c.id] = { name: c.name, contactMethod: c.contactMethod, scheduledDate: c.scheduledDate, source: "scheduled", completed: false, completedAt: null, occasion: null, occasionNotes: null };
      changed = true;
    }
  });
  return changed;
}

/* ---- Migration: upgrade old per-week format to new global format ---- */
function migrateDash() {
  if (!dash.snapshots) dash.snapshots = {};
  if (!dash.priorities) dash.priorities = [];
  if (!dash.mission) dash.mission = { ghms: [], memoryVerses: [], notes: [] };

  // Always sweep any per-week priorities into dash.priorities (dedup by id).
  // This handles partial migrations where dash.priorities existed but some weeks
  // still had stray tasks in the old format.
  const existingIds = new Set(dash.priorities.map(t => t.id));
  const wks = weekKeys();
  wks.forEach(wk => {
    const w = dash.weeks[wk];
    if (!w) return;
    if (w.priorities && w.priorities.length) {
      const isActiveOrFuture = wk >= (dash.activeWeek || curMonday());
      if (isActiveOrFuture) {
        // Tasks from active/future weeks belong in the global list
        w.priorities.forEach(t => {
          if (!existingIds.has(t.id)) {
            dash.priorities.push(t);
            existingIds.add(t.id);
          }
        });
      } else {
        // Tasks from past weeks: preserve as snapshot if not already snapshotted
        if (!dash.snapshots[wk]) {
          dash.snapshots[wk] = {
            priorities: w.priorities,
            mission: w.mission || { ghms: [], memoryVerses: [], notes: [] }
          };
        } else if (!dash.snapshots[wk].priorities || !dash.snapshots[wk].priorities.length) {
          dash.snapshots[wk].priorities = w.priorities;
        }
      }
      delete w.priorities;
    }

    // Also sweep per-week mission entries into global mission (dedup by id)
    if (w.mission) {
      const m = w.mission;
      const ghmIds = new Set(dash.mission.ghms.map(e => e.id));
      const verseIds = new Set(dash.mission.memoryVerses.map(e => e.id));
      const noteIds = new Set(dash.mission.notes.map(e => e.id));
      (m.ghms||[]).forEach(e => { if (!ghmIds.has(e.id)) { dash.mission.ghms.push({...e,week:wk}); ghmIds.add(e.id); } });
      (m.memoryVerses||[]).forEach(e => { if (!verseIds.has(e.id)) { dash.mission.memoryVerses.push({...e,week:wk}); verseIds.add(e.id); } });
      (m.notes||[]).forEach(e => { if (!noteIds.has(e.id)) { dash.mission.notes.push({...e,week:wk}); noteIds.add(e.id); } });
      delete w.mission;
    }

    // Ensure snapshots have a mission field
    if (dash.snapshots[wk] && !dash.snapshots[wk].mission) {
      dash.snapshots[wk].mission = { ghms: [], memoryVerses: [], notes: [] };
    }
  });

  if (!dash.activeWeek) {
    dash.activeWeek = wks.length ? wks[wks.length-1] : curMonday();
  }
  // Ensure emptyWeekCommunity shape for all weeks
  weekKeys().forEach(wk => {
    const w = dash.weeks[wk];
    if (!w.currentSlate) w.currentSlate = {};
    if (!w.introReachedOut) w.introReachedOut = {};
    if (!w.followUps) w.followUps = [];
  });
}

/* ================= Modal system ================= */
const modalStack = [];
function openModal(html, onClose) {
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = '<div class="dialog">' + html + "</div>";
  ov.addEventListener("mousedown", e => { if (e.target === ov) closeModal(ov); });
  ov._onClose = onClose;
  document.body.appendChild(ov);
  modalStack.push(ov);
  const f = ov.querySelector("input,textarea,select"); if (f) setTimeout(() => f.focus(), 30);
  return ov;
}
function closeModal(ov) {
  const m = ov || modalStack[modalStack.length - 1];
  if (!m) return;
  modalStack.splice(modalStack.indexOf(m), 1);
  if (m._onClose) m._onClose();
  m.remove();
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && modalStack.length) closeModal(); });

/* ================= Init / load ================= */
async function loadAll() {
  showSave("Loading…");
  const cRes = await ghGet("data.json");
  if (!cRes) { const e = new Error("no data.json"); e.status = 404; throw e; }
  contacts = cRes.data; contactsSha = cRes.sha;
  let dRes = await ghGet("dashboard.json");
  if (!dRes) {
    dash = defaultDash();
    dashSha = await ghPut("dashboard.json", dash, "Initialize dashboard");
  } else {
    dash = dRes.data; dashSha = dRes.sha;
    // migrate old categories array format
    if (Array.isArray(dash.categories)) {
      const cats = {};
      dash.categories.forEach(c => { if (!cats[c]) cats[c] = []; });
      if (!cats["Life"]) cats["Life"] = [];
      if (!cats["Work"]) cats["Work"] = [];
      dash.categories = cats;
    }
    if (!dash.categories) dash.categories = { Life: [], Work: [] };
    if (!dash.recurringTasks) dash.recurringTasks = [];
    if (!dash.thankyous) dash.thankyous = [];
  }
  migrateDash();
  if (!dash.activeWeek) dash.activeWeek = curMonday();
  ensureWeek(dash.activeWeek);
  if (syncSlate(dash.activeWeek)) saveDash();
  viewedWeek = dash.activeWeek;
  $("setupPrompt").style.display = "none";
  $("hdr").style.visibility = "visible";
  showSave("", 1);
  switchTab("dash");
}

function render() {
  renderHeader();
  if (!dash) return;
  if (currentTab === "dash") renderDash();
  else renderContacts();
}

/* ================= MODULE 1: Priorities ================= */
function curWeekObj() {
  ensureWeek(viewedWeek);
  return dash.weeks[viewedWeek];
}

/* Return list of top-level categories, always Life and Work first, then others alpha */
function topCats() {
  const base = ["Life", "Work"];
  const others = Object.keys(dash.categories).filter(c => !base.includes(c)).sort();
  return [...base, ...others];
}
/* Subcategories for a top cat, sorted alpha */
function subCats(topCat) {
  return (dash.categories[topCat] || []).slice().sort();
}

function renderPriorities(ro) {
  const priorities = viewedPriorities();
  let html = "";
  const tops = topCats();

  // Top Tasks pinned section
  const pinnedTasks = priorities.filter(t => t.pinned && !t.completed);
  if (pinnedTasks.length) {
    const sorted = pinnedTasks.slice().sort((a,b) => PRIO_ORDER[a.priority]-PRIO_ORDER[b.priority]);
    html += '<div class="top-tasks-section">';
    html += '<div class="top-tasks-header"><span>★ Top Tasks</span><span class="ttcount">' + sorted.length + '</span></div>';
    sorted.forEach(t => { html += taskRow(t, ro, true); });
    html += '</div>';
  }

  tops.forEach(top => {
    const subs = subCats(top);
    const colKey = "top_" + top;
    const isCollapsed = !!priCollapsed[colKey];

    // all tasks for this top cat (no subcat or any subcat)
    const topTasks = priorities.filter(t => t.category === top && !t.subcategory);
    const subTasks = {};
    subs.forEach(s => { subTasks[s] = priorities.filter(t => t.category === top && t.subcategory === s); });

    // collect unknown subcats from actual tasks (in case stored before dash.categories updated)
    priorities.forEach(t => {
      if (t.category === top && t.subcategory && !subs.includes(t.subcategory)) {
        if (!subTasks[t.subcategory]) subTasks[t.subcategory] = [];
        subTasks[t.subcategory].push(t);
      }
    });
    const allSubCatKeys = [...subs, ...Object.keys(subTasks).filter(k => !subs.includes(k))].sort();

    html += '<div class="cat-top">';
    html += '<div class="cat-top-h' + (isCollapsed ? " collapsed" : "") + '" onclick="toggleCatCollapse(\'' + esc(colKey) + '\')">' +
      '<h3>' + esc(top) + "</h3><div class=\"line\"></div>";
    if (!ro && !["Life","Work"].includes(top)) {
      html += '<button class="rowdel" style="visibility:visible" onclick="event.stopPropagation();delTopCat(\'' + esc(top) + '\')" title="Remove">✕</button>';
    }
    if (!ro) {
      html += '<button class="linklike" style="font-size:.72rem" onclick="event.stopPropagation();addSubCat(\'' + esc(top) + '\')" title="Add subcategory">+ sub</button>';
    }
    html += '<span class="collapse-icon">▾</span></div>';
    html += '<div class="cat-top-body' + (isCollapsed ? " hidden" : "") + '">';

    // Tasks directly under top cat (no subcategory)
    const sortedTop = topTasks.slice().sort((a,b) => (a.completed-b.completed)||(PRIO_ORDER[a.priority]-PRIO_ORDER[b.priority]));
    if (!sortedTop.length && !allSubCatKeys.length) html += '<div class="empty" style="margin-left:4px">No tasks</div>';
    sortedTop.forEach(t => { html += taskRow(t, ro); });
    if (!ro) {
      const afId = "af-" + top.replace(/\W/g,"_") + "__root";
      html += addTaskForm(afId, top, null);
    }

    // Subcategories
    allSubCatKeys.forEach(sub => {
      const subKey = "sub_" + top + "_" + sub;
      const subCollapsed = !!priCollapsed[subKey];
      const tasks = (subTasks[sub] || []).slice().sort((a,b) => (a.completed-b.completed)||(PRIO_ORDER[a.priority]-PRIO_ORDER[b.priority]));
      const removable = !ro && (dash.categories[top] || []).includes(sub) && !tasks.length;
      html += '<div class="cat-sub">';
      html += '<div class="cat-sub-h' + (subCollapsed ? " collapsed" : "") + '" onclick="toggleCatCollapse(\'' + esc(subKey) + '\')">' +
        '<h4>' + esc(sub) + "</h4><div class=\"line\"></div>";
      if (removable) html += '<button class="rowdel" style="visibility:visible;font-size:.72rem" onclick="event.stopPropagation();delSubCat(\'' + esc(top) + "','" + esc(sub) + '\')" title="Remove subcategory">✕</button>';
      html += '<span class="collapse-icon">▾</span></div>';
      html += '<div class="cat-sub-body' + (subCollapsed ? " hidden" : "") + '">';
      if (!tasks.length) html += '<div class="empty" style="margin-left:4px;font-size:.8rem">No tasks</div>';
      tasks.forEach(t => { html += taskRow(t, ro); });
      if (!ro) {
        const afId = "af-" + top.replace(/\W/g,"_") + "_" + sub.replace(/\W/g,"_");
        html += addTaskForm(afId, top, sub);
      }
      html += '</div></div>';
    });

    html += '</div></div>';
  });

  $("priBody").innerHTML = html;
  $("priBody").querySelectorAll(".addform-toggle").forEach(btn => {
    btn.onclick = () => toggleAddForm(btn.dataset.target);
  });

  // Footer
  $("priFoot").innerHTML = !ro
    ? '<button class="linklike" onclick="addTopCat()">+ Add category</button>'
    : '';
}

function taskRow(t, ro, inTopSection) {
  const statusB = statusBadge(t.taskStatus);
  const prioClass = "task-row-" + (t.priority||"L")[0];
  const pinned = !!t.pinned;
  return '<div class="row ' + prioClass + (t.completed ? " done" : "") + '">' +
    '<input type="checkbox" class="chk" ' + (t.completed ? "checked" : "") + (ro ? " disabled" : "") + ' onchange="toggleTask(\'' + t.id + '\')">' +
    '<div class="grow">' +
      '<span class="txt">' +
      (inTopSection ? '<span class="pin-badge" title="Top Task">★</span>' : "") +
      loePill(t.loe) + " " + esc(t.text) + "</span>" +
      (statusB ? " " + statusB : "") +
      (t.carriedForward ? ' <span class="tag" title="Carried from ' + fmtWeek(t.createdWeek||viewedWeek) + '">↩</span>' : "") +
      (t.isRecurring ? ' <span class="tag">↻ ' + (t.recurringCadence ? t.recurringCadence + "d" : "recurring") + "</span>" : "") +
    "</div>" +
    (!ro ? '<button class="pin-btn' + (pinned ? " pinned" : "") + '" onclick="togglePin(\'' + t.id + '\')" title="' + (pinned ? "Remove from Top Tasks" : "Pin to Top Tasks") + '">★</button>' +
           '<button class="rowedit" onclick="editTask(\'' + t.id + '\')" title="Edit">✎</button>' +
           '<button class="rowdel" onclick="delTask(\'' + t.id + '\')" title="Delete">✕</button>' : "") +
    "</div>";
}

function addTaskForm(afId, topCat, subCat) {
  return '<button class="linklike addform-toggle" data-target="' + afId + '" style="margin-left:2px">+ Add task</button>' +
    '<div class="addform" id="' + afId + '" data-cat="' + esc(topCat) + '" data-sub="' + esc(subCat || "") + '">' +
    '<div class="frow"><input type="text" placeholder="Task…" onkeydown="if(event.key===\'Enter\')submitTask(\'' + afId + '\')"></div>' +
    '<div class="frow">' +
      '<select class="sel-prio"><option>High</option><option>Medium</option><option selected>Low</option></select>' +
      '<select class="sel-loe" title="Level of Effort"><option value="High">LOE: High</option><option value="Medium">LOE: Med</option><option value="Low" selected>LOE: Low</option></select>' +
    '</div>' +
    '<div class="frow">' +
      '<label style="font-size:.8rem;color:var(--text-2);display:flex;align-items:center;gap:4px"><input type="checkbox" class="rec"> Recurring every <input type="number" class="rec-days" value="7" min="1" style="width:52px;padding:4px 6px"> days</label>' +
    '</div>' +
    '<div class="frow" style="justify-content:flex-end"><button class="btn primary sm" onclick="submitTask(\'' + afId + '\')">Add</button></div>' +
    '</div>';
}

function toggleCatCollapse(key) {
  priCollapsed[key] = !priCollapsed[key];
  try { sessionStorage.setItem("priCollapsed", JSON.stringify(priCollapsed)); } catch(e){}
  renderPriorities(isPastWeek());
}
function toggleAddForm(id) {
  const f = $(id); if (!f) return;
  f.classList.toggle("open");
  if (f.classList.contains("open")) f.querySelector("input[type=text]").focus();
}
function submitTask(id) {
  const f = $(id); if (!f) return;
  const text = f.querySelector("input[type=text]").value.trim();
  if (!text) return;
  const cat = f.dataset.cat, sub = f.dataset.sub || null;
  const prio = f.querySelector(".sel-prio").value;
  const loe = f.querySelector(".sel-loe").value;
  const recChk = f.querySelector(".rec").checked;
  const recDays = parseInt(f.querySelector(".rec-days").value, 10) || 7;
  const task = {
    id: uuid(), text, category: cat, subcategory: sub || null,
    priority: prio, loe,
    taskStatus: "Not Started",
    isRecurring: recChk, recurringCadence: recChk ? recDays : null,
    completed: false, completedAt: null, createdWeek: viewedWeek, carriedForward: false
  };
  if (recChk) {
    const rt = { id: uuid(), text, category: cat, subcategory: sub || null, priority: prio, loe, cadenceDays: recDays, lastCompletedDate: null };
    dash.recurringTasks.push(rt);
    task.recurringId = rt.id;
  }
  dash.priorities.push(task);
  saveDash(); renderDash();
}
function findTask(id) {
  // Search global list first
  let t = dash.priorities.find(x => x.id === id);
  if (t) return t;
  // Fall back to snapshots (for editing tasks in old weeks — shouldn't normally happen)
  for (const wk of Object.keys(dash.snapshots || {})) {
    t = (dash.snapshots[wk].priorities || []).find(x => x.id === id);
    if (t) return t;
  }
  return null;
}
function toggleTask(id) {
  const t = findTask(id); if (!t) return;
  t.completed = !t.completed;
  t.completedAt = t.completed ? new Date().toISOString() : null;
  // clear status flags on completion
  if (t.completed) t.taskStatus = "Not Started";
  // update recurring last completed
  if (t.completed && t.recurringId) {
    const rt = (dash.recurringTasks || []).find(r => r.id === t.recurringId);
    if (rt) rt.lastCompletedDate = todayStr();
  }
  saveDash(); renderDash();
}
function togglePin(id) {
  const t = findTask(id); if (!t) return;
  t.pinned = !t.pinned;
  saveDash(); renderPriorities(isPastWeek());
}

function editTask(id) {
  const t = findTask(id); if (!t) return;
  const tops = topCats();
  const selOpts = (opts, cur) => opts.map(o => "<option" + (o === cur ? " selected" : "") + ">" + o + "</option>").join("");
  const topOpts = tops.map(o => "<option" + (o === t.category ? " selected" : "") + ">" + esc(o) + "</option>").join("");
  const subList = subCats(t.category);
  const subOptsHtml = () => ["", ...subCats(t.category)].map(o => "<option" + (o === (t.subcategory||"") ? " selected" : "") + ">" + esc(o) + "</option>").join("");
  const statusOpts = TASK_STATUSES.map(s => "<option" + (s === (t.taskStatus||"Not Started") ? " selected" : "") + ">" + s + "</option>").join("");
  const ov = openModal(
    "<h2>Edit Task</h2>" +
    '<label class="fl">Task</label><div class="frow"><input id="etText" value="' + esc(t.text) + '"></div>' +
    '<div class="frow">' +
      '<div><label class="fl">Category</label><select id="etCat">' + topOpts + '</select></div>' +
      '<div><label class="fl">Subcategory</label><select id="etSub">' + subOptsHtml() + '</select></div>' +
    '</div>' +
    '<div class="frow">' +
      '<div><label class="fl">Priority</label><select id="etPrio">' + selOpts(["High","Medium","Low"], t.priority) + '</select></div>' +
      '<div><label class="fl">Level of Effort</label><select id="etLoe">' + selOpts(["High","Medium","Low"], t.loe||"Medium") + '</select></div>' +
    '</div>' +
    '<div class="frow">' +
      '<div><label class="fl">Status</label><select id="etStatus">' + statusOpts + '</select></div>' +
    '</div>' +
    (t.isRecurring ? '<div class="frow"><div><label class="fl">Recurring every (days)</label><input id="etRecDays" type="number" min="1" value="' + (t.recurringCadence||7) + '"></div></div>' : '') +
    '<div class="actions"><button class="btn" id="etCancel">Cancel</button><button class="btn primary" id="etSave">Save</button></div>'
  );
  // update sub options when category changes
  ov.querySelector("#etCat").onchange = function() {
    const subs = ["", ...subCats(this.value)];
    ov.querySelector("#etSub").innerHTML = subs.map(o => "<option>" + esc(o) + "</option>").join("");
  };
  ov.querySelector("#etCancel").onclick = () => closeModal(ov);
  ov.querySelector("#etSave").onclick = () => {
    t.text = ov.querySelector("#etText").value.trim() || t.text;
    t.category = ov.querySelector("#etCat").value;
    t.subcategory = ov.querySelector("#etSub").value || null;
    t.priority = ov.querySelector("#etPrio").value;
    t.loe = ov.querySelector("#etLoe").value;
    t.taskStatus = ov.querySelector("#etStatus").value;
    if (t.isRecurring && t.recurringId) {
      const recDays = parseInt(ov.querySelector("#etRecDays").value, 10) || t.recurringCadence;
      t.recurringCadence = recDays;
      const rt = (dash.recurringTasks||[]).find(r => r.id === t.recurringId);
      if (rt) { rt.cadenceDays = recDays; rt.text = t.text; rt.category = t.category; rt.subcategory = t.subcategory; rt.priority = t.priority; rt.loe = t.loe; }
    }
    saveDash(); closeModal(ov); renderDash();
  };
}
function delTask(id) {
  const t = findTask(id); if (!t) return;
  if (t.isRecurring && t.recurringId && confirm('Also remove "' + t.text + '" from recurring tasks?'))
    dash.recurringTasks = (dash.recurringTasks||[]).filter(r => r.id !== t.recurringId);
  dash.priorities = dash.priorities.filter(x => x.id !== id);
  saveDash(); renderDash();
}
function addTopCat() {
  const name = prompt("New category name:");
  if (!name || !name.trim()) return;
  const n = name.trim();
  if (dash.categories[n]) { toast("Category already exists"); return; }
  dash.categories[n] = [];
  saveDash(); renderDash();
}
function delTopCat(cat) {
  if (!confirm("Remove category \"" + cat + "\"?")) return;
  delete dash.categories[cat];
  saveDash(); renderDash();
}
function addSubCat(topCat) {
  const name = prompt("Subcategory name under " + topCat + ":");
  if (!name || !name.trim()) return;
  const n = name.trim();
  if (!dash.categories[topCat]) dash.categories[topCat] = [];
  if (dash.categories[topCat].includes(n)) { toast("Subcategory already exists"); return; }
  dash.categories[topCat].push(n);
  saveDash(); renderDash();
}
function delSubCat(topCat, sub) {
  dash.categories[topCat] = (dash.categories[topCat]||[]).filter(s => s !== sub);
  saveDash(); renderDash();
}

/* ================= MODULE 2: Community ================= */
function contactById(id) { return contacts.find(c => c.id === id); }

function renderCommunity(ro) {
  const w = curWeekObj();
  if (!w.introReachedOut) w.introReachedOut = {};
  let html = "";

  /* ---- Follow Up ---- */
  const fuItems = (w.followUps || []).sort((a,b) => (a.completed-b.completed)||(a.contactName||"").localeCompare(b.contactName||""));
  html += '<div class="sec"><div class="sec-h"><h3>Follow Up</h3><div>' +
    '<span class="cnt">' + fuItems.filter(f=>!f.completed).length + "</span> " +
    (!ro ? '<button class="linklike" onclick="openFollowUpPicker()">+ Add</button>' : "") + "</div></div>";
  if (!fuItems.length) html += '<div class="empty">No pending follow-ups</div>';
  fuItems.forEach(f => {
    html += '<div class="row followup-row' + (f.completed ? " done" : "") + '">' +
      '<input type="checkbox" class="chk" style="--colc:var(--orange)" ' + (f.completed ? "checked" : "") + (ro ? " disabled" : "") + ' onchange="toggleFollowUp(\'' + f.id + '\')">' +
      '<div class="grow">' +
        '<span class="txt c-name" onclick="openContact(\'' + esc(f.contactId) + '\')">' + esc(f.contactName) + "</span>" +
        (f.action ? ' <span class="followup-action">' + esc(f.action) + "</span>" : "") +
        (f.notes ? '<div class="c-sub" style="font-style:italic">' + esc(f.notes) + "</div>" : "") +
      "</div>" +
      (!ro ? '<button class="rowedit" onclick="editFollowUp(\'' + f.id + '\')" title="Edit">✎</button>' +
             '<button class="rowdel" onclick="delFollowUp(\'' + f.id + '\')" title="Remove">✕</button>' : "") +
      "</div>";
  });
  html += "</div>";

  /* ---- Current Slate (segmented by day) ---- */
  const slateEntries = Object.entries(w.currentSlate).filter(([,s]) => !s.removed);
  const slateTotal = slateEntries.length;
  const slateDone = slateEntries.filter(([,s]) => s.completed).length;
  html += '<div class="sec" id="slateWrap"><div class="sec-h"><h3>Current Slate</h3><div>' +
    '<span class="cnt">' + slateDone + "/" + slateTotal + "</span> " +
    (!ro ? '<button class="linklike" onclick="openSlatePicker()">+ Add</button>' : "") + "</div></div>";

  // Build per-day groups for the full week (Mon–Sun)
  const wkStart = viewedWeek;
  const todayIso = todayStr();
  let hasAnySlate = false;
  for (let di = 0; di < 7; di++) {
    const dayIso = addDaysISO(wkStart, di);
    const dayEntries = slateEntries.filter(([,s]) => s.scheduledDate === dayIso);
    // also show manually-added entries with no date in Monday bucket
    const noDate = di === 0 ? slateEntries.filter(([,s]) => !s.scheduledDate && s.source === "manual") : [];
    const allForDay = [...dayEntries, ...noDate];
    const isPast = dayIso < todayIso;
    const isToday = dayIso === todayIso;
    const dayClass = "day-label" + (isToday ? " today" : "") + (isPast ? " past" : "") + (!allForDay.length ? " no-entry" : "");
    html += '<div class="day-group"><div class="' + dayClass + '">' + DAYS_OF_WEEK[di] + " · " + fmtShort(dayIso) + "</div>";
    if (!allForDay.length) {
      html += '<div class="empty" style="font-size:.78rem;margin-left:6px">—</div>';
    } else {
      hasAnySlate = true;
      allForDay.forEach(([cid, s]) => {
        const occasionBadge = s.occasion ? '<span class="occasion-badge">' + esc(s.occasion) + "</span>" : "";
        html += '<div class="row' + (s.completed ? " done" : "") + '" style="--colc:var(--green);margin-left:6px">' +
          '<input type="checkbox" class="chk" ' + (s.completed ? "checked" : "") + (ro ? " disabled" : "") + ' onchange="toggleSlate(\'' + cid + '\')">' +
          '<div class="grow"><span class="txt c-name" onclick="openContact(\'' + cid + '\')">' + esc(s.name) + "</span>" + occasionBadge +
          (s.occasionNotes ? '<div class="c-sub" style="font-style:italic">' + esc(s.occasionNotes) + "</div>" : "") +
          '<div class="c-sub">' + esc(s.contactMethod || "") + (s.source === "manual" && !s.scheduledDate ? " · added" : "") + "</div></div>" +
          (!ro ? '<button class="rowedit" onclick="editSlateOccasion(\'' + cid + '\')" title="Occasion/Notes">✎</button>' +
                 (s.source === "manual" ? '<button class="rowdel" onclick="removeSlate(\'' + cid + '\')" title="Remove">✕</button>' : "") : "") +
          "</div>";
      });
    }
    html += "</div>";
  }
  html += "</div>";

  /* ---- Intro Queue ---- */
  const introAll = contacts.filter(isReachOut).sort((a,b) => (PRIO_ORDER[a.priority]-PRIO_ORDER[b.priority])||a.name.localeCompare(b.name));
  // split: not reached out vs reached out pending scheduling
  const introQueue = introAll.filter(c => !w.introReachedOut[c.id]);
  const introReached = introAll.filter(c => w.introReachedOut[c.id]);
  html += '<div class="sec"><div class="sec-h"><h3>Intro Queue</h3><span class="cnt">' + introQueue.length + "</span></div>";
  if (!introQueue.length) html += '<div class="empty">No pending introductions</div>';
  introQueue.forEach(c => {
    html += '<div class="row"><div class="dot" style="background:var(--orange)"></div>' +
      '<div class="grow"><span class="c-name" onclick="openContact(\'' + c.id + '\')">' + esc(c.name) + "</span> " + prioPill(c.priority) +
      '<div class="c-sub">' + esc(c.notes || (c.tags||[]).join(", ") || "—") + "</div></div>" +
      (!ro ? '<label style="font-size:.72rem;color:var(--text-2);white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:3px">' +
        '<input type="checkbox" onchange="markIntroReachedOut(\'' + c.id + '\',this.checked)"> Reached out</label>' : "") +
      "</div>";
  });
  html += "</div>";

  /* ---- Reached Out (pending scheduling) ---- */
  if (introReached.length) {
    html += '<div class="sec"><div class="sec-h"><h3>Reached Out</h3><span class="cnt">' + introReached.length + "</span></div>";
    introReached.forEach(c => {
      html += '<div class="row reached-out-row"><div class="dot" style="background:var(--purple)"></div>' +
        '<div class="grow"><span class="c-name" onclick="openContact(\'' + c.id + '\')">' + esc(c.name) + "</span>" +
        ' <span class="pill" style="color:var(--purple);background:var(--purple-bg)">Pending scheduling</span>' +
        '<div class="c-sub">' + esc(c.notes || (c.tags||[]).join(", ") || "—") + "</div></div>" +
        (!ro ? '<button class="rowdel" onclick="unmarkIntroReachedOut(\'' + c.id + '\')" title="Undo">↩</button>' : "") +
        "</div>";
    });
    html += "</div>";
  }

  /* ---- Action Needed ---- */
  const action = contacts.filter(c => !isReachOut(c) && !c.onHold && c.manualStatus !== "On Hold" && c.lastContactedDate &&
    ((!c.manualStatus && daysUntilNext(c) < 0) ||
     (c.manualStatus === "Scheduled" && c.scheduledDate && daysBetween(todayDate(), parseDate(c.scheduledDate)) >= 0 && daysBetween(todayDate(), parseDate(c.scheduledDate)) <= 7)))
    .sort((a,b) => daysUntilNext(a) - daysUntilNext(b));

  // Collect unique locations and tags for filter
  const allLocs = [...new Set(action.map(c => c.location).filter(Boolean))].sort();
  const allTags = [...new Set(action.flatMap(c => c.tags || []))].sort();

  html += '<div class="sec"><div class="sec-h"><h3>Action Needed</h3><span class="cnt">' + action.length + "</span></div>";
  if (!action.length) html += '<div class="empty">No action needed</div>';
  action.forEach(c => {
    const du = daysUntilNext(c);
    const overdue = du < 0 ? Math.abs(du) + "d overdue" : "";
    const scheduled = (c.manualStatus === "Scheduled" && c.scheduledDate) ? "scheduled " + fmtShort(c.scheduledDate) : "";
    const badge = overdue || scheduled || "";
    html += '<div class="row"><div class="dot" style="background:' + (du < 0 ? "var(--red)" : "var(--yellow)") + '"></div>' +
      '<div class="grow"><span class="c-name" onclick="openContact(\'' + c.id + '\')">' + esc(c.name) + "</span>" +
      (badge ? ' <span class="pill" style="color:' + (du < 0 ? "var(--red)" : "var(--yellow)") + ';background:' + (du < 0 ? "var(--red-bg)" : "var(--yellow-bg)") + '">' + badge + "</span>" : "") +
      '</div></div>';
  });
  html += "</div>";

  $("comBody").innerHTML = html;
}

/* ---- Follow-up helpers ---- */
function toggleFollowUp(id) {
  const w = curWeekObj();
  const f = (w.followUps || []).find(x => x.id === id);
  if (!f) return;
  f.completed = !f.completed;
  f.completedAt = f.completed ? new Date().toISOString() : null;
  saveDash(); render();
}
function editFollowUp(id) {

}
function openFollowUpPicker() {

  const ov = openModal(
    '<h2>Add Follow-Up</h2>' +
    '<label class="fl">Contact</label><select id="fuContact"><option value="">— pick one —</option>' +
    candidates.map(c => '<option value="' + c.id + '">' + esc(c.name) + '</option>').join('') + '</select>' +

/* ---- Slate helpers ---- */
function toggleSlate(cid) {
  const w = curWeekObj();
  if (!w.currentSlate[cid]) return;
  const s = w.currentSlate[cid];
  s.completed = !s.completed;
  s.completedAt = s.completed ? new Date().toISOString() : null;
  if (s.completed) {
    const c = contacts.find(x => x.id === cid);
    if (c) {
      const confirmed = confirm("Log conversation with " + c.name + "?");
      if (confirmed) {
        logConversation(c, todayStr(), s.occasionNotes || s.occasion || "", s.occasion || "");
      }
    }
  }
  saveDash(); render();
}
function removeSlate(cid) {
  const w = curWeekObj();
  if (w.currentSlate[cid]) w.currentSlate[cid].removed = true;
  saveDash(); render();
}
function editSlateOccasion(cid) {
  const w = curWeekObj();
  const s = w.currentSlate[cid];
  if (!s) return;
  const ov = openModal(
    '<h2>Edit Occasion</h2>' +
    '<label class="fl">Date</label><div class="frow"><input type="date" id="schDateEdit" value="' + (s.scheduledDate || todayStr()) + '"></div>' +
    '<label class="fl">Occasion</label><div class="frow"><input id="schOccEdit" value="' + esc(s.occasion || "") + '"></div>' +
    '<label class="fl">Notes</label><textarea id="schNotesEdit">' + esc(s.occasionNotes || "") + '</textarea>' +
    '<div class="actions"><button class="btn" id="schEditCancel">Cancel</button><button class="btn primary" id="schEditSave">Save</button></div>'
  );
  ov.querySelector('#schEditCancel').onclick = () => closeModal(ov);
  ov.querySelector('#schEditSave').onclick = () => {
    const newDate = ov.querySelector('#schDateEdit').value;
    const newOcc = ov.querySelector('#schOccEdit').value.trim();
    const newNotes = ov.querySelector('#schNotesEdit').value.trim();
    const newWk = newDate ? fmtISO(mondayOf(parseDate(newDate))) : viewedWeek;
    if (newWk !== viewedWeek) {
      // Move to different week
      ensureWeek(newWk);
      dash.weeks[newWk].currentSlate[cid] = { ...s, scheduledDate: newDate, occasion: newOcc, occasionNotes: newNotes };
      delete w.currentSlate[cid];
    } else {
      s.scheduledDate = newDate;
      s.occasion = newOcc;
      s.occasionNotes = newNotes;
    }
    saveDash(); closeModal(ov); render();
  };
}
function openSlatePicker() {

/* ================= Mission ================= */
function renderMission(ro) {
  const mis = viewedMission();
  let html = "";

  /* Thank Yous */
  const tyItems = (dash.thankyous || []).sort((a,b) => (a.completed-b.completed)||new Date(b.createdAt)-new Date(a.createdAt));
  html += '<div class="sec"><div class="sec-h"><h3>Thank You</h3><div>' +
    '<span class="cnt">' + tyItems.filter(t=>!t.completed).length + '</span> ' +
    (!ro ? '<button class="linklike" onclick="addThankYou()">+ Add</button>' : '') + '</div></div>';
  if (!tyItems.length) html += '<div class="empty">No pending thank yous</div>';
  tyItems.slice(0,5).forEach(t => {
    html += '<div class="row' + (t.completed ? ' done' : '') + '"><input type="checkbox" class="chk" style="--colc:var(--amber)" ' +
      (t.completed ? 'checked' : '') + (ro ? ' disabled' : '') + ' onchange="toggleThankYou(\'' + t.id + '\')">' +
      '<div class="grow"><span class="txt">' + esc(t.text) + '</span></div>' +
      (!ro ? '<button class="rowdel" onclick="delThankYou(\'' + t.id + '\')" title="Remove">✕</button>' : '') + '</div>';
  });
  html += '</div>';

  /* GHMs */
  const ghms = mis.ghms.slice().sort((a,b) => new Date(b.createdAt)-new Date(a.createdAt));
  html += '<div class="sec"><div class="sec-h"><h3>GHMs — God Honored Moments</h3><span class="cnt">' + ghms.length + '</span></div>';
  if (!ro) {
    html += '<div class="mission-add-form">' +
      '<input id="ghmTitle" placeholder="Title..." style="margin-bottom:6px">' +
      '<textarea id="ghmNotes" placeholder="Notes (optional)..." rows="2"></textarea>' +
      '<button class="btn sm primary" onclick="addGhm()" style="margin-top:6px;align-self:flex-end">Add</button></div>';
  }
  if (!ghms.length) html += '<div class="empty">No moments recorded yet</div>';
  ghms.forEach(g => {
    const isCurrentWk = g.week === dash.activeWeek;
    html += '<div class="row' + (!isCurrentWk ? ' greyed' : '') + '">' +
      '<div class="grow">' +
      '<div style="font-size:.72rem;color:var(--text-2);margin-bottom:1px">' + fmtTime(g.createdAt) + '</div>' +
      '<strong class="txt">' + esc(g.title || g.text) + '</strong>' +
      (g.notes ? '<div class="c-sub">' + esc(g.notes) + '</div>' : '') +
      '</div>' +
      (isCurrentWk && !ro ? '<button class="rowdel" onclick="delMission(\'ghms\',\'' + g.id + '\')" title="Remove">✕</button>' : '') +
      '</div>';
  });
  html += '</div>';

  /* Memory Verses */
  const verses = mis.memoryVerses.slice().sort((a,b) => new Date(b.createdAt)-new Date(a.createdAt));
  html += '<div class="sec"><div class="sec-h"><h3>Memory Verses</h3><span class="cnt">' + verses.length + '</span></div>';
  if (!ro) {
    html += '<div class="mission-add-form">' +
      '<input id="verseRef" placeholder="Reference (e.g. John 3:16)..." style="margin-bottom:6px">' +
      '<textarea id="verseText" placeholder="Verse text..." rows="3"></textarea>' +
      '<input id="verseMeaning" placeholder="Meaning / why this matters (optional)..." style="margin-top:6px">' +
      '<button class="btn sm primary" onclick="addVerse()" style="margin-top:6px;align-self:flex-end">Add</button></div>';
  }
  if (!verses.length) html += '<div class="empty">Nothing yet</div>';
  verses.forEach(v => {
    const isCurrentWk = v.week === dash.activeWeek;
    html += '<div class="row' + (!isCurrentWk ? ' greyed' : '') + '">' +
      '<div class="grow">' +
      (v.reference ? '<div style="font-size:.78rem;font-weight:700;color:var(--amber);margin-bottom:2px">' + esc(v.reference) + '</div>' : '') +
      '<span class="txt">' + esc(v.text) + '</span>' +
      (v.meaning ? '<div class="c-sub">' + esc(v.meaning) + '</div>' : '') +
      '</div>' +
      (isCurrentWk && !ro ? '<button class="rowdel" onclick="delMission(\'memoryVerses\',\'' + v.id + '\')" title="Remove">✕</button>' : '') +
      '</div>';
  });
  html += '</div>';

  /* Notes */
  const notes = mis.notes.slice().sort((a,b) => new Date(b.createdAt)-new Date(a.createdAt));
  html += '<div class="sec"><div class="sec-h"><h3>Notes</h3><span class="cnt">' + notes.length + '</span></div>';
  if (!ro) {
    html += '<div class="frow" style="margin-bottom:8px">' +
      '<input id="noteText" placeholder="Add a note..." style="flex:1" onkeydown="if(event.key===\'Enter\')addNote()">' +
      '<button class="btn sm primary" onclick="addNote()">Add</button></div>';
  }
  if (!notes.length) html += '<div class="empty">No notes yet</div>';
  notes.forEach(n => {
    const isCurrentWk = n.week === dash.activeWeek;
    const isFU = n.followUp;
    html += '<div class="row' + (n.completed ? ' done' : '') + (!isCurrentWk ? ' greyed' : '') + '">' +
      '<input type="checkbox" class="chk" style="--colc:var(--amber)" ' + (n.completed ? 'checked' : '') + (ro ? ' disabled' : '') +
      ' onchange="toggleNote(\'' + n.id + '\')">' +
      '<div class="grow"><span class="txt">' + esc(n.text) + '</span>' +
      (isFU ? ' <span class="pill" style="color:var(--orange);background:var(--orange-bg);font-size:.65rem">FU</span>' : '') +
      '</div>' +
      (isCurrentWk && !ro ? '<button class="rowdel" onclick="delMission(\'notes\',\'' + n.id + '\')" title="Remove">✕</button>' : '') +
      '</div>';
  });
  html += '</div>';

  $('misBody').innerHTML = html;
}

/* ---- Mission data helpers ---- */
function addGhm() {
  const title = $('ghmTitle').value.trim();
  const notes = $('ghmNotes').value.trim();
  if (!title) { toast('Title required'); return; }
  dash.mission.ghms.unshift({ id: uuid(), title, text: title, notes, createdAt: new Date().toISOString(), week: dash.activeWeek });
  saveDash(); render(); $('ghmTitle').value = ''; $('ghmNotes').value = '';
}
function addVerse() {
  const ref = $('verseRef').value.trim();
  const text = $('verseText').value.trim();
  const meaning = $('verseMeaning').value.trim();
  if (!text) { toast('Verse text required'); return; }
  dash.mission.memoryVerses.unshift({ id: uuid(), reference: ref || null, text, meaning: meaning || null, createdAt: new Date().toISOString(), week: dash.activeWeek });
  saveDash(); render(); $('verseRef').value = ''; $('verseText').value = ''; $('verseMeaning').value = '';
}
function addNote() {
  const text = $('noteText').value.trim();
  if (!text) return;
  dash.mission.notes.unshift({ id: uuid(), text, completed: false, completedAt: null, followUp: false, createdAt: new Date().toISOString(), week: dash.activeWeek });
  saveDash(); render(); $('noteText').value = '';
}
function toggleNote(id) {
  const n = dash.mission.notes.find(x => x.id === id);
  if (!n) return;
  n.completed = !n.completed;
  n.completedAt = n.completed ? new Date().toISOString() : null;
  saveDash(); render();
}
function findMission(key, id) {
  return dash.mission[key] && dash.mission[key].find(x => x.id === id);
}
function delMission(key, id) {
  if (!dash.mission[key]) return;
  dash.mission[key] = dash.mission[key].filter(x => x.id !== id);
  saveDash(); render();
}
function addThankYou() {
  const text = prompt('What are you thankful for?');

  dash.thankyous.unshift({ id: uuid(), text: text.trim(), completed: false, completedAt: null, createdAt: new Date().toISOString() });

}
function toggleThankYou(id) {
  const t = (dash.thankyous||[]).find(x => x.id === id);
  if (!t) return;
  t.completed = !t.completed;
  t.completedAt = t.completed ? new Date().toISOString() : null;

}
function delThankYou(id) {
  dash.thankyous = (dash.thankyous||[]).filter(x => x.id !== id);

}

/* ================= Contact view (All Contacts tab) ================= */
function renderContacts() {
  const q = cFilter.q.toLowerCase();
  const tp = cFilter.type;
  const sorted = contacts.filter(c => {
    if (tp !== "All" && typeOf(c) !== tp) return false;
    if (q && !c.name.toLowerCase().includes(q) && !(c.notes||"").toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b) => {
    if (cFilter.sort === "name") return a.name.localeCompare(b.name);
    if (cFilter.sort === "overdue") return daysUntilNext(a) - daysUntilNext(b);
    return 0;
  });
  const maintain = sorted.filter(c => !isReachOut(c));
  const reachOut = sorted.filter(isReachOut);
  let html = "";
  const renderGroup = (arr) => arr.forEach(c => {
    const st = autoStatus(c);
    const [sc, sbg] = STATUS_COLORS[st] || ["var(--gray)","var(--gray-bg)"];
    html += '<div class="c-card" onclick="openContact(\'' + c.id + '\')">' +
      '<div class="c-card-top"><span class="c-name">' + esc(c.name) + '</span>' +
      '<span class="pill" style="color:' + sc + ';background:' + sbg + '">' + st + '</span></div>' +
      '<div class="c-sub">' + esc(c.location || '') + (c.location && c.tags && c.tags.length ? ' · ' : '') +
      (c.tags||[]).map(t => '<span class="tag">' + esc(t) + '</span>').join(' ') + '</div>' +
      '</div>';
  });
  if (maintain.length) {
    html += '<div class="sec-h" style="margin-bottom:8px"><h3>Maintain (' + maintain.length + ')</h3></div>';
    renderGroup(maintain);
  }
  if (reachOut.length) {
    html += '<div class="sec-h" style="margin-top:16px;margin-bottom:8px"><h3>Reach Out (' + reachOut.length + ')</h3></div>';
    renderGroup(reachOut);
  }
  if (!sorted.length) html += '<div class="empty">No contacts match</div>';
  $('cList').innerHTML = html;
}

function typeOf(c) { return c.type || "Friend"; }

    '<div><label class="fl">Method</label><select id="eMethod">' + sel(['Phone','Email','In Person','Meal'], c ? c.contactMethod : 'Phone') + '</select></div></div>' +
    '<div class="frow"><div><label class="fl">Cadence (days)</label><input id="eCad" type="number" min="1" value="' + (c ? c.cadenceDays : 90) + '"></div>' +
    '<div><label class="fl">Last contacted</label><input id="eLast" type="date" value="' + (c ? c.lastContactedDate : todayStr()) + '"></div></div>' +
    '<label class="fl">Tags (comma-separated)</label><div class="frow"><input id="eTags" value="' + esc(c ? (c.tags || []).join(', ') : '') + '"></div>' +
    '<label class="fl">Notes</label><textarea id="eNotes">' + v('notes') + '</textarea>' +
    '<div class="actions"><button class="btn" id="eCancel">Cancel</button><button class="btn primary" id="eSave">' + (isNew ? 'Add' : 'Save') + '</button></div>');
  ov.querySelector('#eCancel').onclick = () => closeModal(ov);
  ov.querySelector('#eSave').onclick = () => {
    const name = ov.querySelector('#eName').value.trim();
    if (!name) { toast('Name is required'); return; }
    const data = {
      name,
      type: ov.querySelector('#eType').value,
      priority: ov.querySelector('#ePrio').value,
      location: ov.querySelector('#eLoc').value.trim(),
      contactMethod: ov.querySelector('#eMethod').value,
      cadenceDays: parseInt(ov.querySelector('#eCad').value, 10) || 90,
      lastContactedDate: ov.querySelector('#eLast').value || todayStr(),
      tags: ov.querySelector('#eTags').value.split(',').map(s => s.trim()).filter(Boolean),
      notes: ov.querySelector('#eNotes').value.trim()
    };
    if (isNew) contacts.push({ id: uuid(), conversationHistory: [], manualStatus: null, scheduledDate: null, onHold: false, ...data });
    else Object.assign(c, data);
    saveContacts(); closeModal(ov); render(); toast(isNew ? 'Contact added' : 'Saved ✓');
  };
}
</script>
</body>
</html>
